local_costmap:
  ros__parameters:
    update_frequency: 3.0
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.05
    robot_radius: 0.2
    plugins: ["static_layer", "inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 5.0
      inflation_radius: 0.0
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True

global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    update_frequency: 0.5
    resolution: 0.05
    plugins: ["static_layer", "inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.0
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "map1.yaml"


waypoint_follower:
  ros__parameters:
    use_sim_time: True            # 仿真请改为 True
    stop_on_failure: false         # 遇到单点失败是否停止
    loop_rate: 20                  # 检查导航任务结果的频率
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 指定要加载的插件 ID
    wait_at_waypoint:              # 与上面插件 ID 保持一致的名称
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # 插件完整类名
      enabled: True                # 是否启用
      waypoint_pause_duration: 200 # 停留时长（毫秒）
